[project]
name = "aii601"
version = "0.1.0"
description = "Decision-making for Intelligent Agents (AII 601) coursework"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "sortedcontainers>=2.4",
    "shapely>=2.0",
    "scipy>=1.11",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "ortools>=9.15.6755",
    "torch>=2.15.0",
    "gymnasium[classic-control]>=1.4.0",
    "stable-baselines3>=2.9.2",
    "pandas>=3.0.6",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
